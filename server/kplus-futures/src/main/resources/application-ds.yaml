spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    #    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${postgrsql_server:localhost}:6543/gdb?currentSchema=fina&useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${postgrsql_username:kplus_app_rw}
    password: ${postgrsql_password}
    
    hikari:
      # 最大连接池大小（默认值）
      maximum-pool-size: 10
      # 最小空闲连接数（默认值）
      minimum-idle: 10
      # 获取连接超时时间（默认 30 秒）
      connection-timeout: 30000
      # 空闲连接存活时间（默认 10 分钟）
      idle-timeout: 600000
      # 连接最大生命周期（默认 30 分钟）
      max-lifetime: 1800000
      # 空闲连接检查间隔（默认禁用）
      keepalive-time: 0
      # 初始化失败超时（默认 1 秒）
      initialization-fail-timeout: 1000
      # 验证连接超时（默认 5 秒）
      validation-timeout: 5000

  # redis 配置
  redis:
    # 地址
    host: ${redis_host:127.0.0.1}
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: ${redis_password:''}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms