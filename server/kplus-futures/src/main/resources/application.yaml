app:
  name: K-PLUS
  site: https://kplus.kdaiyu.com
  version: 1.0.1
  copyright: 2025
  upload-base: /uploadFiles/kplus
  upload-provider: local
  # 获取ip地址开关
  address-enabled: true
  # ip地址数据库文件路径
  address-db-path: D:/ip2region.xdb
  # 应用启动自定义初始化初始化全局变量
  start-listener-enabled: true
  # 验证码
  captcha:
    # 验证码类型 math/char/aj 更具业务需要选择，无用的可以注释配置类
    type: aj
    cache-type: redis
  
  security:
    ignore:
      urls: /, /login, /logout, /druid/**, /register
    token:
      secret: ***REMOVED***
      # 令牌有效期（默认30分钟）
      expireTime: 30

  cors:
    # *.kdaiyu.com, *.kdaiyu.cn, local.kdaiyu.com:8088
    allowed-origin: "*"

logging:
  config: classpath:log4j2.xml # 线上环境可以指定配置文件
server:
  port: 8088
  servlet:
    context-path: /api

spring:
  config:
    import:
      - classpath:application-ds.yaml
      - classpath:aj-captcha.yaml
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mail:
    host: smtp.126.com
    port: 25
    username: kdaiyu@126.com
    password: ***REMOVED***
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-flex:
  mapper-locations:
    - classpath*:cn/kdaiy/**/mapper/*Mapper.xml
  global-config:
    print-banner: false
    deleted-value-of-logic-delete: '1'
    normal-value-of-logic-delete: '0'
    logic-delete-column: del_flag
    
  audit-sql-enable: true

user:
  password:
    # 最大无验证吗错误次数
    maxRetryNanCaptchaCount: 2
    # 密码最大错误次数
    maxRetryCount: 10
    # 密码锁定时间（默认10分钟）
    lockTime: 60