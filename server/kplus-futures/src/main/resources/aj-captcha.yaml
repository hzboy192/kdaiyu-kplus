captcha:
  # aj验证码, 参数说明检aj-config.properties    
  aj:
    # aes加密坐标开启或者禁用(true|false)
    aes-status: true
    font-size: 25
    font-style: 1
    history-data-clear-enable: false
    # 滑动干扰项(0/1/2)
    interference-options: 2
    sliding-block: classpath:captcha/images/slidingBlock
    rotate-block: classpath:captcha/images/rotateBlock
    capt-bg: classpath:captcha/images/captBg
    req-check-minute-limit: 10
    # 接口请求次数一分钟限制是否开启 true|false
    req-frequency-limit-enable: true
    # 验证失败5次，get接口锁定
    req-get-lock-limit: 5
    # 验证失败后，锁定时间间隔,s
    req-get-lock-seconds: 300
    # get接口一分钟内请求数限制
    req-get-minute-limit: 10
    # 校验滑动拼图允许误差偏移量(默认5像素)
    slip-offset: 5
    # 验证码类型：blockPuzzle,rotatePuzzle,clickWord.配置为default时通过页面参数captchaType确定类型
    type: clickWord
    # 右下角水印文字(我的水印)
    water-mark: 由AJ-Captcha提供技术支持